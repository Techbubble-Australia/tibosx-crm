[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile.ticketing-api"
watchPatterns = ["packages/ticketing-api/**", "packages/ticketing-database/**", "packages/config/**", "pnpm-lock.yaml", "pnpm-workspace.yaml", "package.json", "Dockerfile.ticketing-api"]

[deploy]
startCommand = "sh packages/ticketing-api/scripts/start-production.sh"
healthcheckPath = "/health"
healthcheckTimeout = 300
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
