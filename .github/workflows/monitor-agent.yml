name: Monitor agent builds

on:
  workflow_dispatch:
    inputs:
      api_url:
        description: "API base URL baked into the agent (MONITOR_API_URL)"
        required: true
        type: string
  push:
    paths:
      - "apps/monitor-agent/**"
      - ".github/workflows/monitor-agent.yml"
    branches:
      - master
      - staging

concurrency:
  group: monitor-agent-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            platform: macos
          - os: windows-latest
            platform: windows
          - os: ubuntu-22.04
            platform: linux

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.9

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/monitor-agent/src-tauri -> target

      - name: Linux WebKit deps
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libssl-dev

      - name: Install workspace deps
        run: pnpm install --filter @techbubble/monitor-agent...

      - name: Build agent
        working-directory: apps/monitor-agent
        shell: bash
        env:
          MONITOR_API_URL: ${{ inputs.api_url || vars.MONITOR_API_URL || secrets.MONITOR_API_URL }}
        run: |
          if [ -z "${MONITOR_API_URL}" ]; then
            echo "MONITOR_API_URL is required (workflow_dispatch input or repo var/secret MONITOR_API_URL)"
            exit 1
          fi
          echo "Baking MONITOR_API_URL=${MONITOR_API_URL}"
          pnpm tauri:build

      - name: Upload artifacts (macOS)
        if: matrix.platform == 'macos'
        uses: actions/upload-artifact@v4
        with:
          name: tibosx-monitor-macos
          path: |
            apps/monitor-agent/src-tauri/target/release/bundle/dmg/*.dmg
            apps/monitor-agent/src-tauri/target/release/bundle/macos/*.app
          if-no-files-found: warn

      - name: Upload artifacts (Windows)
        if: matrix.platform == 'windows'
        uses: actions/upload-artifact@v4
        with:
          name: tibosx-monitor-windows
          path: |
            apps/monitor-agent/src-tauri/target/release/bundle/msi/*.msi
            apps/monitor-agent/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: warn

      - name: Upload artifacts (Linux)
        if: matrix.platform == 'linux'
        uses: actions/upload-artifact@v4
        with:
          name: tibosx-monitor-linux
          path: |
            apps/monitor-agent/src-tauri/target/release/bundle/deb/*.deb
            apps/monitor-agent/src-tauri/target/release/bundle/appimage/*.AppImage
          if-no-files-found: warn
