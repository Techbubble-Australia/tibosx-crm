[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile.web"
watchPatterns = ["apps/web/**", "packages/ui/**", "packages/database/**", "packages/config/**", "pnpm-lock.yaml", "pnpm-workspace.yaml", "package.json", "Dockerfile.web"]

[deploy]
startCommand = "node server.js"
healthcheckPath = "/"
healthcheckTimeout = 300
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
